<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSF Money</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0a2533;
        color: #e2e8f0;
        user-select: none;
        -webkit-user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        background:
          radial-gradient(ellipse 70% 50% at 50% 0%, rgba(13, 148, 136, 0.28), transparent),
          #0a2533;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      .brand {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
      }
      .status {
        font-size: 0.8125rem;
        color: #94a3b8;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 2px solid rgba(148, 163, 184, 0.25);
        border-top-color: #2dd4bf;
        animation: spin 0.8s linear infinite;
        margin-top: 0.25rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="/logo.png" alt="WSF Money" />
      <p class="brand">WSF Money</p>
      <p class="status">Carregando sua área financeira…</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </body>
</html>
