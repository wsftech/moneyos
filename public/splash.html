<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSF Money</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0a2533;
        color: #e2e8f0;
        user-select: none;
        -webkit-user-select: none;
      }
      .wrap {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        padding-bottom: 3.5rem;
        background:
          radial-gradient(ellipse 70% 50% at 50% 0%, rgba(13, 148, 136, 0.28), transparent),
          #0a2533;
      }
      .logo {
        width: min(240px, 78%);
        height: auto;
        object-fit: contain;
      }
      .status {
        font-size: 0.8125rem;
        color: #94a3b8;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 2px solid rgba(148, 163, 184, 0.25);
        border-top-color: #2dd4bf;
        animation: spin 0.8s linear infinite;
        margin-top: 0.25rem;
      }
      .legal {
        position: absolute;
        bottom: 1rem;
        left: 1rem;
        right: 1rem;
        text-align: center;
        font-size: 0.65rem;
        line-height: 1.35;
        color: #64748b;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="/logo.svg" alt="WSF Money" />
      <p class="status">Carregando sua área financeira…</p>
      <div class="spinner" aria-hidden="true"></div>
      <p class="legal">
        Copyright © 2026 WSF tecnologia Ltda<br />
        CNPJ 54.492.026/0001-23
      </p>
    </div>
  </body>
</html>
